<html>
<head>
    <title>iisnode logs</title>
    <style type="text/css">
        body
        {
            font-family: "Trebuchet MS" , Arial, Helvetica, sans-serif;
        }
        table
        {
            border-collapse: collapse;
        }
        td, th
        {
            border: 1px solid lightgray;
            padding: 3px 7px 2px 7px;
        }
        th
        {
            text-align: left;
            padding-top: 5px;
            padding-bottom: 4px;
            background-color: Gray;
            color: #ffffff;
        }
        td.stderr
        {
            color: Red;
        }
    </style>
</head>
<body>
    <table id="logFilesTable">
        <tr>
            <th>
                Computer name
            </th>
            <th>
                PID
            </th>
            <th>
                Type
            </th>
            <th>
                Created
            </th>
            <th>
                Link
            </th>
        </tr>
    </table>
    <p id="lastUpdated"></p>
    <script type="text/javascript">

        // this is replaced with actual data at runtime by code in interceptor.js
        var logFiles = [{"file":"SHEYLARODELO-21484-stderr-1777345329900.txt","computername":"SHEYLARODELO","pid":21484,"type":"stderr","created":1777345329900},{"file":"SHEYLARODELO-22324-stderr-1777345659296.txt","computername":"SHEYLARODELO","pid":22324,"type":"stderr","created":1777345659296},{"file":"SHEYLARODELO-22324-stdout-1777345659295.txt","computername":"SHEYLARODELO","pid":22324,"type":"stdout","created":1777345659295},{"file":"SHEYLARODELO-7908-stderr-1777345333773.txt","computername":"SHEYLARODELO","pid":7908,"type":"stderr","created":1777345333773},{"file":"SHEYLARODELO-8632-stderr-1777345330075.txt","computername":"SHEYLARODELO","pid":8632,"type":"stderr","created":1777345330075},{"file":"SHEYLARODELO-9300-stderr-1777345333472.txt","computername":"SHEYLARODELO","pid":9300,"type":"stderr","created":1777345333472}];
        var lastUpdated = 1777345659559;
        var date = new Date();

        date.setTime(lastUpdated);
        document.getElementById('lastUpdated').innerHTML = 'Index was last updated ' + date;

        logFiles.sort(function (a, b) {
            return b.created - a.created;
        });

        var logFilesTable = document.getElementById("logFilesTable");
        for (var i = 0; i < logFiles.length; i++) {
            var logFile = logFiles[i];
            date.setTime(logFile.created);
            var row = logFilesTable.insertRow(-1);
            var computerNameCell = row.insertCell(0);
            var pidCell = row.insertCell(1);
            var typeCell = row.insertCell(2);
            var dateCell = row.insertCell(3);
            var logCell = row.insertCell(4);
            computerNameCell.innerHTML = logFile.computername;
            pidCell.innerHTML = logFile.pid.toString();
            typeCell.innerHTML = logFile.type;
            typeCell.setAttribute('class', logFile.type);
            dateCell.innerHTML = date.toString();
            logCell.innerHTML = '<a href="' + logFile.file + '">log</a>';
        };

    </script>
</body>
</html>
